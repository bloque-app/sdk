name: Release SDK

on:
  push:
    tags:
      - 'sdk-v*'
  # Re-publish an existing tag after a failed publish (safe-publish skips versions already on npm).
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          registries: 'https://registry.npmjs.org/'

      # npm trusted publishing (OIDC, provenance) needs npm >= 11.5: Node 24's npm.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install packages
        run: bun install

      - name: Build code
        run: bun run build:sdk-only

      - name: Publish Packages
        run: |
          bun run release:sdk-only
